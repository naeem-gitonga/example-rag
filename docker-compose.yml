services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/lancedb --ignore-existing;
      echo 'Bucket created';
      "

  embedding:
    build:
      context: ./embedding
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./embedding/models:/app/models
    environment:
      EMBEDDING_MODEL_PATH: /app/models/qwen3-embedding-0.6b
      EMBEDDING_PORT: "8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile.dev
    ports:
      - "8002:8080"
    depends_on:
      - minio
      - minio-setup
      - embedding
    environment:
      LANCEDB_URI: s3://lancedb/journal
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      EMBEDDING_SERVICE_URL: http://embedding:8001

  query:
    build:
      context: .
      dockerfile: query/Dockerfile.dev
    ports:
      - "8003:8080"
    depends_on:
      - minio
      - minio-setup
      # - embedding
    environment:
      LANCEDB_URI: s3://lancedb/journal
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      EMBEDDING_SERVICE_URL: http://embedding:8001

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile.dev
      target: dev
    ports:
      - "8080:8080"
    depends_on:
      - ingestion
      - query
    environment:
      GATEWAY_PORT: "8080"
      INGESTION_LAMBDA_ENDPOINT: http://ingestion:8080
      QUERY_LAMBDA_ENDPOINT: http://query:8080
    volumes:
      - ./gateway:/app
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
      target: dev
    ports:
      - "3000:3000"
    depends_on:
      - gateway
      - ingestion
    environment:
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
      INGESTION_LAMBDA_URL: http://ingestion:8080/2015-03-31/functions/function/invocations
    volumes:
      - ./web:/app
      - ./shared:/shared
      - /app/node_modules
      - /app/.next
  
  mongo:
    image: mongo:8.2.3-noble
    container_name: example-rag-mongodb
    restart: unless-stopped

    ports:
      - "9002:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: example_rag
    volumes:
      # Persistent data volume with 1GB limit (enforced at Docker level)
      - mongo_data:/data/db
      # Initialization script (runs on first startup when data dir is empty)
      - ./db/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      # MongoDB configuration
      - ./db/mongod.conf:/etc/mongod.conf:ro
    deploy:
      resources:
        limits:
          memory: 512M  # Limit container memory
    # MongoDB configuration loaded from mongod.conf
    command: ["mongod", "--config", "/etc/mongod.conf"]
    healthcheck:
      test: mongosh --eval 'db.runCommand("ping").ok' localhost:27017/example_rag --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/minio-data
  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/db/data
